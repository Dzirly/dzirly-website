<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZIRLY - En Construction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- Logo SVG -->
            <div class="logo-container">
                <img src="logo_dirli_epure.svg" alt="DZIRLY Logo" class="logo-img" style="width: 450px; height: auto;">
            </div>
            
            <!-- Texte Principal -->
            <h1>En Construction</h1>
            <p class="subtitle">Notre site est actuellement en construction</p>
            
            <!-- Message -->
            <div class="message">
                <p>🚀 Nous travaillons dur pour vous offrir la meilleure expérience de shopping.</p>
                <p>Revenez bientôt !</p>
            </div>
            
            <!-- Email de contact -->
            <div class="contact">
                <p>Des questions ? Contactez-nous :</p>
                <a href="mailto:dzirly.shopping@gmail.com" class="email-link">dzirly.shopping@gmail.com</a>
            </div>
            
            <!-- Loader animé -->
            <div class="loader"></div>
        </div>
    </div>
</body>
</html>
